<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tally — counts your reps by watching you move</title>
  <meta name="description" content="Tally counts squats, push-ups, planks and six more movements through your camera. It runs in your browser: nothing is uploaded, nothing to sign up for.">
  <meta property="og:title" content="Tally">
  <meta property="og:description" content="Counts your reps by watching you move. In the browser, nothing uploaded.">
  <meta property="og:url" content="https://tally.mehmetdedeler.com">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://tally.mehmetdedeler.com/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://tally.mehmetdedeler.com/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c2120" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <script>
    // set the theme before first paint
    try {
      var s = JSON.parse(localStorage.getItem('tally.settings.v1') || '{}');
      if (s.theme === 'paper' || s.theme === 'slate') document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..800,0..100;1,9..144,300..800,0..100&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
  
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-arrow" viewBox="0 0 20 20"><path d="M3.5 10.2c4.2-.3 8.6-.2 12.6 0M11.6 5.6c1.6 1.6 3 3 4.6 4.6-1.6 1.4-3 2.8-4.5 4.4" /></symbol>
      <symbol id="i-down" viewBox="0 0 20 20"><path d="M5.5 8c1.5 1.6 3 3.1 4.6 4.6 1.5-1.6 3-3.1 4.4-4.7" /></symbol>
      <symbol id="i-settings" viewBox="0 0 20 20"><path d="M3.5 6.2h7.2M14.6 6.2h1.9M3.5 13.8h1.9M9.3 13.8h7.2" /><circle cx="12.6" cy="6.2" r="2" /><circle cx="7.4" cy="13.8" r="2" /></symbol>
      <symbol id="i-eye" viewBox="0 0 20 20"><path d="M2.5 10.2C4.4 6.8 7 5.2 10 5.2s5.6 1.6 7.5 5c-1.9 3.3-4.5 4.9-7.5 4.9s-5.6-1.6-7.5-4.9Z" /><circle cx="10" cy="10.1" r="2.4" /></symbol>
      <symbol id="i-mirror" viewBox="0 0 20 20"><path d="M10 3v14" stroke-dasharray="1.6 2.2" /><path d="M7.2 6.2 3.6 10l3.6 3.8M12.8 6.2l3.6 3.8-3.6 3.8" /></symbol>
      <symbol id="i-flip" viewBox="0 0 20 20"><path d="M4 8.2a6.3 6.3 0 0 1 11.3-2.4M16 11.8a6.3 6.3 0 0 1-11.3 2.4" /><path d="M15.6 2.8v3.3h-3.3M4.4 17.2v-3.3h3.3" /></symbol>
      <symbol id="i-sound" viewBox="0 0 20 20"><path d="M3.5 8v4h3l4 3.3V4.7l-4 3.3h-3Z" /><path d="M13.4 7.4c1.3 1.5 1.3 3.7 0 5.2M15.6 5.4c2.4 2.7 2.4 6.5 0 9.2" /></symbol>
      <symbol id="i-close" viewBox="0 0 20 20"><path d="M5.2 5c3.3 3.4 6.4 6.6 9.6 10M14.8 5.2c-3.3 3.2-6.5 6.4-9.7 9.7" /></symbol>
      <symbol id="i-download" viewBox="0 0 20 20"><path d="M10 3.2v9.6M6 9l4 4 4-4M4 16.4h12" /></symbol>
      <symbol id="i-upload" viewBox="0 0 20 20"><path d="M10 13V3.6M6 7.4l4-4 4 4M4 16.4h12" /></symbol>
      <symbol id="i-share" viewBox="0 0 20 20"><path d="M10 12.6V3.4M6.4 6.8 10 3.2l3.6 3.6M5.5 10H4v6.6h12V10h-1.5" /></symbol>
    </defs>
  </svg>

  <header class="top" id="top">
    <div class="wrap">
      <a class="brand" href="/" aria-label="Tally, home"><span id="logo"></span>Tally</a>
      <nav class="nav" aria-label="Main">
        <a href="/" data-nav="/">Count</a>
        <a href="/ledger" data-nav="/ledger">Ledger</a>
        <a href="/about" data-nav="/about">About</a>
        <button class="icon-btn" id="open-settings" type="button" aria-label="Settings" title="Settings"><svg class="ico" aria-hidden="true"><use href="#i-settings" /></svg></button>
      </nav>
    </div>
  </header>

  <main id="view"></main>

  <dialog class="settings" id="settings" aria-labelledby="settings-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">
      <h1>Tally</h1>
      <p>Tally counts your reps by watching you move through your camera. It runs entirely in your browser, so it needs JavaScript turned on.</p>
    </div>
  </noscript>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
